<style>
/* Layout concept: a quiet, neutral workbench so the art plates and sketches carry all the color. */
:root {
  --bg: #ecebe8; --surface: #f8f8f6; --raised: #ffffff; --fg: #1b1b1a; --muted: #67665f; --line: #d6d5d0;
  --accent: #2443d6; --accent-fg: #ffffff; --nope: #b3261e;
  --font-ui: "Hanken Grotesk", system-ui, sans-serif; --font-code: "Geist Mono", ui-monospace, monospace;
  --radius: 14px; --ease: cubic-bezier(.16, 1, .3, 1); --pop: cubic-bezier(.34, 1.56, .64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121211; --surface: #1b1b1a; --raised: #232321; --fg: #ecebe7; --muted: #a3a19b; --line: #33332f; --accent: #8fa3ff; --accent-fg: #0d1030; --nope: #ff8a80; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121211; --surface: #1b1b1a; --raised: #232321; --fg: #ecebe7; --muted: #a3a19b; --line: #33332f; --accent: #8fa3ff; --accent-fg: #0d1030; --nope: #ff8a80; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.6 var(--font-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1360px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* chrome */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; }
.brand { font-weight: 800; font-size: 17px; white-space: nowrap; display: flex; gap: 10px; align-items: center; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: conic-gradient(from 200deg, #c9772b, #e8402a, #1f5f8b, #b8892b, #c9772b); }
.steps { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.steps::-webkit-scrollbar { display: none; }
.step-pill { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; white-space: nowrap; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.step-pill .n { font-family: var(--font-code); font-size: 11px; }
.step-pill.done { color: var(--fg); }
.step-pill.done .n::after { content: " ✓"; }
.step-pill.on { background: var(--fg); color: var(--bg); }
.step-pill:disabled { cursor: default; opacity: .5; }
main { padding-block: 32px 140px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
.head h1 { font-size: clamp(26px, 3.4vw, 40px); line-height: 1.2; margin: 0 0 6px; font-weight: 800; text-wrap: balance; }
.head p { margin: 0; color: var(--muted); max-width: 66ch; }
.legend { display: flex; gap: 16px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.legend b { color: var(--fg); font-weight: 600; }
.bar { position: fixed; inset: auto 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar .wrap { display: flex; gap: 10px; align-items: center; padding-block: 12px; flex-wrap: wrap; }
.bar .status { flex: 1; min-width: 160px; color: var(--muted); font-size: 13px; }
.btn { white-space: nowrap; border: 1px solid var(--line); background: var(--raised); border-radius: 11px; padding: 10px 18px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; min-height: 44px; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.accent { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { flex: none; height: 38px; min-width: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; }
.icon-btn.pick.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.icon-btn.nope.on { color: var(--nope); border-color: var(--nope); }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; min-width: 0; }
.card h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
.card > p.lead { margin: 0 0 18px; color: var(--muted); font-size: 14px; max-width: 70ch; }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field label, .qlabel { font-weight: 600; font-size: 14px; }
.qlabel { display: block; margin: 18px 0 8px; }
.field small { color: var(--muted); font-size: 12.5px; line-height: 1.55; }
.field input, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
.field textarea { min-height: 84px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.section-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 6px 0 12px; letter-spacing: .02em; }
.toast { position: fixed; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .3s var(--ease); z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.note { color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); font-size: 14px; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; }

/* brief */
.brief { display: grid; grid-template-columns: 1.1fr .9fr; gap: 24px; align-items: start; }
.how { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; color: var(--muted); font-size: 14px; }
.how li { display: flex; gap: 10px; }
.how b { color: var(--fg); font-family: var(--font-code); font-size: 12px; min-width: 22px; padding-top: 2px; }

/* discover */
.disc { display: grid; gap: 20px; }
.truth { width: 100%; min-height: 96px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; font-size: 19px; line-height: 1.5; resize: vertical; }
.sliders { display: grid; gap: 14px; }
.sl { display: grid; grid-template-columns: minmax(90px, 1fr) auto minmax(90px, 1fr); gap: 14px; align-items: center; }
.sl .l { text-align: end; font-weight: 600; }
.sl .r { font-weight: 600; }
.seg { display: flex; gap: 6px; }
.seg button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); position: relative; }
.seg button::after { content: ""; position: absolute; inset: 50% auto auto 50%; translate: -50% -50%; border-radius: 50%; background: var(--muted); width: var(--d); height: var(--d); opacity: .5; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); }
.seg button[aria-pressed="true"]::after { background: var(--accent-fg); opacity: 1; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.tile-btn { text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 18px; min-height: 112px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
.tile-btn strong { font-size: 19px; line-height: 1.2; font-weight: 800; }
.tile-btn span { color: var(--muted); font-size: 13px; }
.tile-btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.chipset { display: flex; flex-wrap: wrap; gap: 8px; }
.chipset button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; min-height: 40px; }
.chipset button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.check { display: flex; gap: 10px; align-items: center; margin-top: 14px; color: var(--muted); font-size: 14px; }
.check input { width: 18px; height: 18px; }

/* plates and sketches */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 20px; }
.grid.two { grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); }
.opt { position: relative; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: border-color .2s, box-shadow .2s, opacity .2s; min-width: 0; }
.opt.picked { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.opt.noped { opacity: .38; }
.opt .meta { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.opt .meta .txt { flex: 1; min-width: 0; }
.opt .meta strong { display: block; font-size: 15px; }
.opt .meta span { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; }
.opt .op { padding: 0 14px 14px; color: var(--muted); font-size: 13.5px; line-height: 1.55; margin: -4px 0 0; }
.opt .meta .tag, .tag { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-inline-start: 6px; font-weight: 400; white-space: nowrap; }
.tag.fit { color: var(--accent); border-color: var(--accent); }
.badge { position: absolute; top: 12px; inset-inline-start: 12px; z-index: 5; background: var(--accent); color: var(--accent-fg); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; opacity: 0; transform: scale(.8); transition: opacity .2s, transform .3s var(--pop); pointer-events: none; }
.opt.picked .badge { opacity: 1; transform: none; }
.stage { position: relative; display: block; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border: 0; padding: 0; background: var(--surface); cursor: pointer; }
.stage:focus-visible { outline-offset: -4px; }
.stage.static { cursor: default; }
.frame { position: absolute; left: 0; top: 0; width: 1200px; height: 750px; transform-origin: 0 0; }
.spin { position: absolute; inset: auto 12px 12px auto; z-index: 4; background: var(--fg); color: var(--bg); font-size: 12px; padding: 4px 10px; border-radius: 999px; }

/* concept cards */
.concepts { display: grid; gap: 28px; }
.concept { display: grid; grid-template-columns: 1.35fr 1fr; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; transition: border-color .2s, box-shadow .2s, opacity .2s; }
.concept.picked { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.concept.noped { opacity: .4; }
.concept .stage { border-right: 1px solid var(--line); cursor: default; }
.concept .body { padding: 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.concept h3 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 800; text-wrap: balance; }
.concept .src { display: flex; flex-wrap: wrap; gap: 6px; }
.concept .src span { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.concept .idea { margin: 0; font-size: 15.5px; }
.concept .rule { margin: 0; padding: 12px 14px; background: var(--surface); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; font-weight: 600; font-size: 15px; }
.concept dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
.concept dt { color: var(--muted); font-weight: 600; }
.concept dd { margin: 0; }
.concept .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
.loader { display: grid; gap: 10px; place-items: center; text-align: center; padding: 60px 20px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); }
.loader strong { color: var(--fg); font-size: 18px; }
.pulse { width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(from 0deg, var(--accent), transparent 70%); animation: ts-spin 1.1s linear infinite; }

/* refine */
.refine-top { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; margin-bottom: 28px; }
.sub-title { font-size: 18px; font-weight: 800; margin: 32px 0 14px; }
.grid.three { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.chip { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; text-align: start; }
.chip small { color: var(--muted); font-size: 12px; }
.chip strong { font-size: 14px; }

/* prompt */
.result { display: grid; gap: 24px; }
.prompt-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.prompt-tools .note { flex: 1; min-width: 200px; }
textarea.prompt { width: 100%; min-height: 560px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--raised); padding: 18px; font: 13px/1.65 var(--font-code); resize: vertical; }
.warn { display: grid; gap: 6px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.warn strong { font-size: 14px; }
.history { display: grid; gap: 8px; }
.hist-item { display: flex; gap: 12px; align-items: center; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.hist-item .t { flex: 1; min-width: 0; }
.hist-item .t strong { display: block; font-size: 14px; }
.hist-item .t span { color: var(--muted); font-size: 12px; }

@media (max-width: 960px) {
  .brief, .refine-top { grid-template-columns: 1fr; }
  .concept { grid-template-columns: 1fr; }
  .concept .stage { border-right: 0; border-bottom: 1px solid var(--line); }
}
@media (max-width: 520px) {
  .row2 { grid-template-columns: 1fr; }
  .bar .status { display: none; }
  .bar .btn { flex: 1; justify-content: center; padding-inline: 10px; }
  .brand span { display: none; }
  .sl { grid-template-columns: 1fr 1fr; }
  .sl .l { text-align: start; }
  .sl .r { text-align: end; }
  .sl .seg { grid-column: 1 / -1; grid-row: 2; justify-content: space-between; }
}

/* ============ LOCAL SKETCH (inside .frame, 1200×750, always LTR) ============ */
.sketch { position: absolute; inset: 0; background: var(--bg); color: var(--fg); font-family: var(--body); direction: ltr; text-align: left; overflow: hidden; }
.sketch .art { position: absolute; inset: 0; width: 100%; height: 100%; }
.sketch .ov { position: absolute; display: flex; flex-direction: column; gap: 22px; z-index: 2; }
.sketch .ov.left { left: 72px; top: 0; bottom: 0; width: 460px; justify-content: center; }
.sketch .ov.center { left: 50%; top: 50%; translate: -50% -50%; width: 640px; align-items: center; text-align: center; }
.sketch .ov.bottom { left: 72px; right: 72px; bottom: 64px; }
.sketch .ov.top { left: 72px; top: 70px; width: 700px; }
.sketch .eyebrow { font-family: var(--mono); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sketch h2 { margin: 0; font-family: var(--display); font-weight: var(--dw); text-transform: var(--dc); letter-spacing: var(--dt); line-height: var(--lh); font-size: 62px; text-wrap: balance; color: var(--fg); }
.sketch .ov.bottom h2 { font-size: 46px; max-width: 18ch; }
.sketch .ov.center h2 { font-size: 52px; }
.sketch p { margin: 0; font-size: 20px; line-height: 1.5; color: var(--muted); max-width: 32ch; }
.sketch .act { align-self: flex-start; font-family: var(--body); font-weight: 600; font-size: 19px; color: var(--fg); border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
.sketch .ov.center .act { align-self: center; }
.sketch .sway { transform-origin: 880px 0; animation: ts-sway 7s ease-in-out infinite alternate; }

@keyframes ts-spin { to { transform: rotate(360deg); } }
@keyframes ts-sway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Taste Studio</span></div>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="bar" id="bar"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Taste Studio — library.
   Art sources are stored as OPERATIONS (what the work does), never as looks to copy.
   Every study is an original composition that demonstrates the operation. */

const FONT_SPEC = {
  "Hanken Grotesk": "Hanken+Grotesk:wght@400;500;600;800", "Geist Mono": "Geist+Mono:wght@400;500",
  "Jost": "Jost:wght@300;500;700", "Inter Tight": "Inter+Tight:wght@400;600;800", "Fraunces": "Fraunces:ital,wght@0,400;0,600;0,900;1,400",
  "Karla": "Karla:wght@400;600", "IBM Plex Sans": "IBM+Plex+Sans:wght@400;500;600", "IBM Plex Mono": "IBM+Plex+Mono:wght@400;500",
  "Big Shoulders Display": "Big+Shoulders+Display:wght@500;800", "Archivo": "Archivo:wght@400;600;800", "Syne": "Syne:wght@500;700;800",
  "Manrope": "Manrope:wght@400;600;800", "Cormorant Garamond": "Cormorant+Garamond:ital,wght@0,400;0,600;1,400",
  "Literata": "Literata:wght@400;600", "Bodoni Moda": "Bodoni+Moda:ital,wght@0,400;0,700;1,400", "Newsreader": "Newsreader:ital,wght@0,400;0,600;1,400",
  "Marcellus": "Marcellus", "Source Serif 4": "Source+Serif+4:wght@400;600", "Spectral": "Spectral:wght@300;400;600",
  "Work Sans": "Work+Sans:wght@400;600", "Young Serif": "Young+Serif", "Libre Franklin": "Libre+Franklin:wght@400;600;900",
  "Anton": "Anton", "Public Sans": "Public+Sans:wght@400;600;900", "Josefin Sans": "Josefin+Sans:wght@300;600;700",
  "Courier Prime": "Courier+Prime:wght@400;700", "Antonio": "Antonio:wght@400;700", "EB Garamond": "EB+Garamond:ital,wght@0,400;0,600;1,400",
  "DM Serif Display": "DM+Serif+Display:ital@0;1", "DM Sans": "DM+Sans:wght@400;600", "DM Mono": "DM+Mono:wght@400;500",
  "Red Hat Display": "Red+Hat+Display:wght@400;700;900", "Figtree": "Figtree:wght@400;600", "Schibsted Grotesk": "Schibsted+Grotesk:wght@400;600;900",
  "Alfa Slab One": "Alfa+Slab+One", "Bricolage Grotesque": "Bricolage+Grotesque:wght@400;700;800", "Unbounded": "Unbounded:wght@400;500;700",
  "Gloock": "Gloock", "Instrument Serif": "Instrument+Serif:ital@0;1", "Abril Fatface": "Abril+Fatface", "Space Mono": "Space+Mono:wght@400;700",
  "Oswald": "Oswald:wght@400;600", "Martian Mono": "Martian+Mono:wght@400;500", "Fragment Mono": "Fragment+Mono", "Red Hat Mono": "Red+Hat+Mono:wght@400;500",
};

/* Discover: every vector is [energy, tone, time, access, voice, finish], each −2..2:
   quiet↔loud, precise↔playful, timeless↔of-the-moment, exclusive↔welcoming, serious↔witty, crafted↔raw. */
const SLIDERS = [
  { id: "energy", left: "Quiet", right: "Loud" }, { id: "tone", left: "Precise", right: "Playful" },
  { id: "time", left: "Timeless", right: "Of the moment" }, { id: "access", left: "Exclusive", right: "Welcoming" },
  { id: "voice", left: "Serious", right: "Witty" }, { id: "finish", left: "Crafted", right: "Raw" },
];
const PLACES = [
  { id: "library", name: "A library", desc: "Quiet, ordered, timeless", vec: [-2, -2, 2, 0, -1, -2] },
  { id: "studio", name: "A recording studio", desc: "Focused, technical, a little raw", vec: [0, -1, 0, -1, 0, 1] },
  { id: "market", name: "A street market", desc: "Loud, open, everyone welcome", vec: [2, 2, -1, 2, 1, 2] },
  { id: "gallery", name: "A gallery", desc: "Space around every object", vec: [-1, -1, 1, -2, -1, -2] },
  { id: "workshop", name: "A workshop", desc: "Tools out, work in progress", vec: [0, 0, 0, 1, 0, 2] },
  { id: "garden", name: "A walled garden", desc: "Cultivated, patient, inward", vec: [-1, -1, 2, -1, -1, -1] },
  { id: "theatre", name: "A theatre", desc: "A stage, entrances and exits", vec: [1, 1, 1, 0, 1, 0] },
  { id: "teahouse", name: "A teahouse", desc: "Warm, unhurried, conversational", vec: [-1, 1, 1, 2, 1, 0] },
];
const FEELINGS = ["Trust", "Wonder", "Calm", "Curiosity", "Belonging", "Ambition", "Delight", "Gravity", "Focus", "Recognition"];

// Small helpers for palettes and type
const pal = (bg, fg, muted, line, accent, accent2) => ({ bg, fg, muted, line, accent, accent2 });
const ty = (display, dw, body, mono, dc = "none", dt = "-0.02em", lh = 1.02) => ({ display, dw, body, mono, dc, dt, lh });

const SOURCES = [
  { id: "albers", name: "Interaction of color", after: "Josef Albers", kind: "Modern",

    let h = 1779033703 ^ seedStr.length;
    for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
    let a = h >>> 0;
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

    }

    for (let i = w; i >= 0; i -= step) pts.push([x + i, y + h + (R() - .5) * jag]);

async function polish() {

2. Keep the truth, concept, rule, art source and every concrete value (hex colors, font names, weights) unless it breaks the rule.

${draft.slice(0, 50000)}`;

    <button class="icon-btn" data-h="copy" data-i="${i}">Copy</button><button class="icon-btn" data-h="del" data-i="${i}" aria-label="Delete">✕</button></div>`).join("");

function copy(text, ta) {

  try { navigator.clipboard.writeText(text).then(() => toast("Copied"), fallback); } catch { fallback(); }
}
let toastT; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400); }
function done(i) {

}
