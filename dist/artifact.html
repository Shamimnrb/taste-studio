<title>Taste Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>document.documentElement.lang = "en"; document.documentElement.dir = "ltr";</script>
<style>
/* Layout concept: a quiet, neutral workbench so the large samples carry all the color. */
:root {
  --bg: #ecebe8;
  --surface: #f8f8f6;
  --raised: #ffffff;
  --fg: #1b1b1a;
  --muted: #6a6965;
  --line: #d6d5d0;
  --accent: #2443d6;
  --accent-fg: #ffffff;
  --nope: #b3261e;
  --font-ui: "Hanken Grotesk", system-ui, sans-serif;
  --font-code: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --radius: 14px;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --surface: #1b1b1a; --raised: #232321; --fg: #ecebe7; --muted: #9b9994;
    --line: #2f2f2c; --accent: #8fa3ff; --accent-fg: #0d1030; --nope: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1b1b1a; --raised: #232321; --fg: #ecebe7; --muted: #9b9994;
  --line: #2f2f2c; --accent: #8fa3ff; --accent-fg: #0d1030; --nope: #ff8a80; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.6 var(--font-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; }
.brand { font-weight: 800; font-size: 17px; white-space: nowrap; display: flex; gap: 10px; align-items: center; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: conic-gradient(from 200deg, #ff6b2c, #ffd23f, #2443d6, #ff5c8a, #ff6b2c); }
.steps { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.steps::-webkit-scrollbar { display: none; }
.step-pill { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; white-space: nowrap; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.step-pill .n { font-family: var(--font-code); font-size: 11px; }
.step-pill.done { color: var(--fg); }
.step-pill.done .n::after { content: " ✓"; }
.step-pill.on { background: var(--fg); color: var(--bg); }
.step-pill:disabled { cursor: default; opacity: .5; }

/* step head */
main { padding-block: 32px 140px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
.head h1 { font-size: clamp(26px, 3.4vw, 40px); line-height: 1.25; margin: 0 0 6px; font-weight: 800; text-wrap: balance; }
.head p { margin: 0; color: var(--muted); max-width: 62ch; }
.legend { display: flex; gap: 16px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.legend b { color: var(--fg); font-weight: 600; }

/* option grid: deliberately big */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 540px), 1fr)); gap: 20px; }
.grid.three { grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); }
.opt { position: relative; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: border-color .2s, box-shadow .2s, opacity .2s, transform .35s var(--ease); }
.opt:hover { border-color: color-mix(in srgb, var(--fg) 30%, var(--line)); }
.opt.picked { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.opt.noped { opacity: .38; }
.opt .stage { position: relative; height: 420px; cursor: pointer; border: 0; padding: 0; text-align: left; background: none; display: block; width: 100%; }
.grid.three .opt .stage { height: 360px; }
.opt .stage:focus-visible { outline-offset: -4px; }
.opt .meta { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.opt .meta .txt { flex: 1; min-width: 0; }
.opt .meta strong { display: block; font-size: 15px; }
.opt .meta span { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; }
.used { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-inline-start: 6px; font-weight: 400; }
.icon-btn { flex: none; height: 38px; min-width: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; }
.icon-btn.pick.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.icon-btn.nope.on { color: var(--nope); border-color: var(--nope); }
.badge { position: absolute; top: 12px; inset-inline-start: 12px; z-index: 5; background: var(--accent); color: var(--accent-fg); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; opacity: 0; transform: scale(.8); transition: opacity .2s, transform .3s cubic-bezier(.34, 1.56, .64, 1); pointer-events: none; }
.opt.picked .badge { opacity: 1; transform: none; }

/* bottom bar */
.bar { position: fixed; inset: auto 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar .wrap { display: flex; gap: 10px; align-items: center; padding-block: 12px; flex-wrap: wrap; }
.bar .status { flex: 1; min-width: 160px; color: var(--muted); font-size: 13px; }
.btn { white-space: nowrap; border: 1px solid var(--line); background: var(--raised); border-radius: 11px; padding: 10px 18px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; min-height: 44px; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.accent { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* brief form */
.brief { display: grid; grid-template-columns: 1.1fr .9fr; gap: 24px; align-items: start; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field label { font-weight: 600; font-size: 14px; }
.field small { color: var(--muted); font-size: 12.5px; line-height: 1.55; }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
.field textarea { min-height: 84px; resize: vertical; }
.field input[dir="ltr"], .field textarea[dir="ltr"] { text-align: left; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.section-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 6px 0 12px; letter-spacing: .02em; }
.preview-mini { position: relative; height: 360px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.how { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; color: var(--muted); font-size: 14px; }
.how li { display: flex; gap: 10px; }
.how b { color: var(--fg); font-family: var(--font-code); font-size: 12px; min-width: 22px; padding-top: 2px; }

/* density + motion */
.sub-title { font-size: 18px; font-weight: 800; margin: 36px 0 14px; }
.sub-title:first-child { margin-top: 0; }

/* result */
.result { display: grid; gap: 24px; }
.final-stage { position: relative; aspect-ratio: 3 / 2; max-width: 100%; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.chip { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; text-align: start; }
.chip small { color: var(--muted); font-size: 12px; }
.chip strong { font-size: 14px; }
.chip.nopes strong { font-weight: 400; color: var(--muted); font-size: 13px; }
.prompt-box { display: grid; gap: 12px; }
.prompt-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.prompt-tools .note { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
textarea.prompt { width: 100%; min-height: 520px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--raised); padding: 18px; font: 13px/1.65 var(--font-code); direction: ltr; text-align: left; resize: vertical; }
.history { display: grid; gap: 8px; }
.hist-item { display: flex; gap: 12px; align-items: center; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.hist-item .t { flex: 1; min-width: 0; }
.hist-item .t strong { display: block; font-size: 14px; }
.hist-item .t span { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); font-size: 14px; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; }

.toast { position: fixed; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .3s var(--ease); z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .brief { grid-template-columns: 1fr; }
  .opt .stage { height: 360px; }
  .final-stage { aspect-ratio: 1 / 1; }
}
@media (max-width: 520px) {
  .row2 { grid-template-columns: 1fr; }
  .opt .stage, .grid.three .opt .stage { height: 320px; }
  .bar .status { display: none; }
  .bar .btn { flex: 1; justify-content: center; padding-inline: 10px; }
  .brand span { display: none; }
}

/* ============ SAMPLE RENDERING (inside each stage, always LTR) ============ */
.mock { --pad: clamp(14px, 4.2cqi, 40px); container-type: size; position: absolute; inset: 0; background: var(--m-bg); color: var(--m-tx); font-family: var(--m-fb); overflow: hidden; direction: ltr; text-align: left; line-height: 1.5; }
.mock * { box-sizing: border-box; }
.mock .d { font-family: var(--m-fd); font-weight: var(--m-dw); text-transform: var(--m-dc); letter-spacing: var(--m-dt); line-height: var(--m-lh); margin: 0; text-wrap: balance; }
.mock .mo { font-family: var(--m-fm); font-size: max(9px, 1.5cqi); letter-spacing: .14em; text-transform: uppercase; color: var(--m-mu); }
.mock .bd { font-size: max(11px, 1.9cqi); color: var(--m-mu); max-width: 46ch; margin: 0; }
.mock .cta { display: inline-flex; align-items: center; gap: .6em; background: var(--m-ac); color: var(--m-acfg); font-family: var(--m-fb); font-weight: 600; font-size: max(11px, 1.8cqi); padding: .75em 1.15em; border-radius: var(--m-r); border: 0; box-shadow: var(--m-sh); white-space: nowrap; }
.mock .lnk { font-size: max(11px, 1.8cqi); border-bottom: 1px solid currentColor; padding-bottom: 2px; }
.mock .nav { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: calc(var(--pad) * .6) var(--pad); z-index: 3; }
.mock .nav .logo { font-family: var(--m-fd); font-weight: var(--m-dw); font-size: max(12px, 2.2cqi); letter-spacing: -.02em; text-transform: none; }
.mock .nav .links { display: flex; gap: 2.4cqi; }
.mock .sig { position: relative; overflow: hidden; background: var(--m-sf); }
.mock .sig canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mock .hair { border-top: 1px solid var(--m-ln); }

/* layout: split */
.L-split .body { position: absolute; inset: 0; display: grid; grid-template-columns: 1.25fr 1fr; gap: var(--pad); padding: calc(var(--pad) * 2.2) var(--pad) var(--pad); }
.L-split .left { display: flex; flex-direction: column; justify-content: flex-end; gap: 2.4cqh; min-width: 0; }
.L-split .d { font-size: 8.4cqi; }
.L-split .sig { border-radius: calc(var(--m-r) * 1.4); }

/* layout: giant */
.L-giant .body { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: calc(var(--pad) * 2.2) var(--pad) var(--pad); gap: 2.4cqh; }
.L-giant .d { font-size: 13.5cqi; line-height: calc(var(--m-lh) * .95); }
.L-giant .sig { border-radius: calc(var(--m-r) * .8); min-height: 0; }
.L-giant .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* layout: letter */
.L-letter .body { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3cqh; padding: calc(var(--pad) * 2) var(--pad); }
.L-letter .d { font-size: 6.2cqi; max-width: 20ch; }
.L-letter .bd { text-align: center; }
.L-letter .sig { width: 22cqh; height: 22cqh; border-radius: 50%; background: transparent; }

/* layout: index */
.L-index .body { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1.2fr; gap: calc(var(--pad) * 1.2); padding: calc(var(--pad) * 2.2) var(--pad) var(--pad); }
.L-index .left { display: flex; flex-direction: column; gap: 2.2cqh; justify-content: space-between; min-width: 0; }
.L-index .d { font-size: 6.6cqi; }
.L-index .rows { display: flex; flex-direction: column; justify-content: flex-end; }
.L-index .r { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 1.7cqh 0; border-top: 1px solid var(--m-ln); font-size: max(11px, 1.9cqi); align-items: baseline; }
.L-index .r:last-child { border-bottom: 1px solid var(--m-ln); }
.L-index .r .mo { font-size: max(9px, 1.3cqi); }
.L-index .r:first-child { color: var(--m-ac); }
.L-index .sig { height: 7cqh; border-radius: 4px; }

/* layout: magazine */
.L-mag .body { position: absolute; inset: 0; display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: auto 1fr; gap: var(--pad); padding: calc(var(--pad) * 2.2) var(--pad) var(--pad); }
.L-mag .d { font-size: 8cqi; grid-column: 1 / -1; }
.L-mag .sig { border-radius: 2px; min-height: 0; }
.L-mag .col { display: flex; flex-direction: column; gap: 2cqh; justify-content: space-between; min-width: 0; }
.L-mag .cap { font-size: max(9px, 1.3cqi); color: var(--m-mu); font-style: italic; }

/* layout: terminal */
.L-term .body { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: var(--pad); padding: calc(var(--pad) * 2.2) var(--pad) var(--pad); font-family: var(--m-fm); }
.L-term .lines { display: flex; flex-direction: column; justify-content: flex-end; gap: 1.4cqh; font-size: max(10px, 1.7cqi); min-width: 0; }
.L-term .d { font-size: 5.6cqi; }
.L-term .cur { display: inline-block; width: .55em; height: 1em; background: var(--m-ac); vertical-align: -.15em; animation: ts-blink 1s steps(1) infinite; }
.L-term .sig { border: 1px solid var(--m-ln); background: transparent; }

/* layout: bento */
.L-bento .body { position: absolute; inset: 0; display: grid; grid-template-columns: 1.5fr 1fr 1fr; grid-template-rows: 1.3fr 1fr; gap: calc(var(--pad) * .4); padding: calc(var(--pad) * 2.2) var(--pad) var(--pad); }
.L-bento .tile { background: var(--m-sf); border-radius: var(--m-r); padding: calc(var(--pad) * .55); display: flex; flex-direction: column; justify-content: space-between; min-width: 0; min-height: 0; overflow: hidden; border: 1px solid var(--m-ln); }
.L-bento .t1 { grid-row: 1 / 3; }
.L-bento .t2 { grid-column: 2 / 4; padding: 0; }
.L-bento .t4 { background: var(--m-ac); color: var(--m-acfg); border-color: transparent; }
.L-bento .t4 .mo { color: inherit; opacity: .8; }
.L-bento .d { font-size: 6.4cqi; }
.L-bento .big { font-family: var(--m-fd); font-weight: var(--m-dw); font-size: 7cqi; line-height: 1; }
.L-bento .sig { position: absolute; inset: 0; }

/* signature helpers (CSS based) */
.sg-fill { position: absolute; inset: 0; }
.sg-outline { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.sg-outline span { position: absolute; font-family: var(--m-fd); font-weight: var(--m-dw); text-transform: var(--m-dc); letter-spacing: var(--m-dt); white-space: nowrap; line-height: 1; }
.sg-outline .o { color: transparent; -webkit-text-stroke: 1.5px var(--m-tx); }
.sg-outline .f { color: var(--m-ac); animation: ts-wipe 4.5s var(--ease) infinite alternate; }
.sg-marq { position: absolute; left: -20%; right: -20%; height: 18%; display: flex; align-items: center; overflow: hidden; font-family: var(--m-fd); font-weight: var(--m-dw); text-transform: var(--m-dc); white-space: nowrap; }
.sg-marq .tr { display: flex; gap: 1.2em; animation: ts-marq 14s linear infinite; padding-right: 1.2em; }
.sg-marq.b .tr { animation-direction: reverse; animation-duration: 18s; }
.sg-num { position: absolute; right: -4%; bottom: -14%; font-family: var(--m-fd); font-weight: var(--m-dw); line-height: .8; color: var(--m-ac); letter-spacing: -.06em; }
.sg-glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--m-fd); font-weight: var(--m-dw); color: var(--m-ac); line-height: .8; }
.sg-shape { position: absolute; animation: ts-spin 22s linear infinite; }
.sg-ticket { position: absolute; left: 12%; right: 12%; height: 30%; background: var(--m-bg); border: 1px solid var(--m-ln); border-radius: 8px; padding: 6% 7%; display: flex; flex-direction: column; justify-content: space-between; transition: transform .6s var(--ease); -webkit-mask: radial-gradient(circle at 0 50%, transparent 9px, #000 10px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 9px, #000 10px) right / 51% 100% no-repeat; mask: radial-gradient(circle at 0 50%, transparent 9px, #000 10px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 9px, #000 10px) right / 51% 100% no-repeat; }
.sg-blob { position: absolute; width: 62%; aspect-ratio: 1; left: 19%; top: 50%; translate: 0 -50%; background: var(--m-ac); animation: ts-blob 10s ease-in-out infinite; }
.sg-hair svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sg-hair line, .sg-hair rect { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: ts-draw 3.2s var(--ease) forwards; }

/* structure wireframes */
.wf { position: absolute; inset: 0; background: var(--m-bg); padding: 16px 18%; display: flex; flex-direction: column; gap: 8px; overflow: hidden; direction: ltr; font-family: var(--font-ui); }
.wf .blk { border-radius: 6px; background: var(--m-sf); border: 1px solid var(--m-ln); color: var(--m-mu); font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; flex: none; }
.wf .blk.hero { background: var(--m-tx); color: var(--m-bg); font-weight: 700; }
.wf .blk.acc { background: var(--m-ac); color: var(--m-acfg); }
.wf .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: none; }

/* density silhouettes */
.dens { position: absolute; inset: 0; background: var(--m-bg); display: flex; justify-content: center; align-items: flex-start; padding: 22px; }
.dens .page { width: min(260px, 70%); display: flex; flex-direction: column; gap: 8px; }
.dens .b { border-radius: 4px; background: var(--m-sf); border: 1px solid var(--m-ln); }
.dens .b.x { background: var(--m-tx); }
.dens .b.a { background: var(--m-ac); border-color: transparent; }

/* motion demo */
.mdemo { position: absolute; inset: 0; background: var(--m-bg); color: var(--m-tx); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; direction: ltr; }
.mdemo .w { font-family: var(--m-fd); font-weight: var(--m-dw); text-transform: var(--m-dc); letter-spacing: var(--m-dt); font-size: 46px; line-height: 1; display: flex; overflow: hidden; padding: 4px 0; }
.mdemo .w span { display: inline-block; }
.mdemo .cta { position: static; }
.mdemo .cnt { font-family: var(--m-fm); font-size: 13px; color: var(--m-mu); letter-spacing: .12em; }
.play-calm .w { animation: ts-rise 1100ms cubic-bezier(.2, .7, .2, 1) both; }
.play-calm .cta { animation: ts-rise 1100ms cubic-bezier(.2, .7, .2, 1) 200ms both; }
.play-snappy .w, .play-snappy .cta { animation: ts-pop 420ms cubic-bezier(.34, 1.56, .64, 1) both; }
.play-snappy .cta { animation-delay: 90ms; }
.play-mech .w { animation: ts-step 600ms steps(4) both; }
.play-glitch .w { animation: ts-glitch 420ms steps(2) both; }
.play-type .w span { animation: ts-roll 550ms cubic-bezier(.16, 1, .3, 1) both; }

@keyframes ts-blink { 50% { opacity: 0; } }
@keyframes ts-wipe { 0% { clip-path: inset(0 100% 0 0); } 100% { clip-path: inset(0 0 0 0); } }
@keyframes ts-marq { to { transform: translateX(-50%); } }
@keyframes ts-spin { to { transform: rotate(360deg); } }
@keyframes ts-blob { 0%, 100% { border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; } 33% { border-radius: 63% 37% 39% 61% / 55% 32% 68% 45%; } 66% { border-radius: 36% 64% 52% 48% / 62% 58% 42% 38%; } }
@keyframes ts-draw { to { stroke-dashoffset: 0; } }

function ensureShown(kind) {

if (window.claude?.use) {
  window.claude.use("sample").then(s => { sample = s; if (STEPS[S.step].id === "result") render(); }).catch(() => {});
  window.claude.use("downloads").then(d => { downloads = d; if (STEPS[S.step].id === "result") render(); }).catch(() => {});
}

function renderResult(main) {
  if (!S.prompt || S.promptSource === "local") { S.prompt = buildPrompt(); S.promptSource = "local"; }
  const T = tokens(), name = s => s ? s : "—";
  const st = STRUCTURES.find(x => x.id === S.picks.struct), dn = DENSITIES.find(x => x.id === S.picks.dens), mo = MOTIONS.find(x => x.id === S.picks.motion), sg = SIGS.find(x => x.id === T.sig);
  const chip = (i, l, v) => `<button class="chip" data-go="${i}"><small>${l}</small><strong>${esc(name(v))}</strong></button>`;
  const nopeCount = Object.values(S.nope).reduce((a, v) => a + (v || []).length, 0);
  main.innerHTML = `<div class="head"><div><h1>This is your combination.</h1><p>Every pick on one page. Click a card to change that round. The prompt is ready below.</p></div></div>
  <div class="result">
    <div class="final-stage" data-tok id="final">${heroHTML(T)}</div>
    <div class="chips">${chip(1, "Direction", T.dir.fa)}${chip(2, "Type", `${T.pair.d} + ${T.pair.b}`)}${chip(3, "Color", T.pal.fa)}${chip(4, "Structure", st?.fa)}${chip(5, "Signature", sg?.fa)}${chip(6, "Density & motion", dn && mo ? `${dn.fa} · ${mo.fa}` : "")}
      <div class="chip nopes"><small>Rejected</small><strong>${nopeCount ? `${nopeCount}, listed under AVOID` : "None"}</strong></div></div>
    <div class="prompt-box">
      <div class="prompt-tools">
        ${sample ? `<button class="btn accent" id="refine">${S.promptSource === "claude" ? "Polish again with Claude" : "Polish with Claude"}</button><button class="btn" id="stop" hidden>Stop</button>` : ""}
        <button class="btn primary" id="copy">Copy prompt</button>
        ${downloads ? `<button class="btn" id="dl">Download .md</button>` : ""}
        <button class="btn" id="keep">Save to history</button>
        ${S.promptSource === "claude" ? `<button class="btn" id="reset">Back to base version</button>` : ""}
        <span class="note" id="pnote">${S.promptSource === "claude" ? "Polished by Claude. You can edit it directly." : sample ? "Base version built from your picks. Claude can complete section copy and details for your product while keeping every chosen value (uses your own Claude account)." : "Built from your picks. Copy it and give it to Claude."}</span>
      </div>
      <label for="ptext" class="section-label">Prompt</label>
      <textarea class="prompt" id="ptext" spellcheck="false">${esc(S.prompt)}</textarea>
    </div>
    <div><h2 class="sub-title">History</h2><div class="history" id="hist"></div></div>
  </div>`;
  $("#final")._T = T; mountAll(main);
  main.querySelectorAll("[data-go]").forEach(c => c.onclick = () => go(+c.dataset.go));
  const ta = $("#ptext"); ta.oninput = () => { S.prompt = ta.value; if (S.promptSource === "local") S.promptSource = "edited"; save(); };
  $("#copy").onclick = () => copy(ta.value, ta);
  $("#keep").onclick = () => { history.unshift({ ts: Date.now(), name: S.brief.name, title: `${T.dir.fa} · ${T.pal.fa}`, prompt: ta.value, picks: { ...S.picks } }); history = history.slice(0, 30); store.set("history", history); toast("Saved to history"); renderHistory(); };
  if ($("#dl")) $("#dl").onclick = async () => { try { await downloads.save({ filename: `${(S.brief.name || "design").toLowerCase().replace(/[^a-z0-9]+/g, "-")}-prompt.md`, data: ta.value }); toast("Saved"); } catch (e) { if (e?.code !== "declined") toast("Download isn’t available here — use Copy"); } };
  if ($("#reset")) $("#reset").onclick = () => { S.prompt = buildPrompt(); S.promptSource = "local"; save(); render(); };
  if ($("#refine")) $("#refine").onclick = refine;
  renderHistory();
}

async function refine() {
  const ta = $("#ptext"), note = $("#pnote"), btn = $("#refine"), stop = $("#stop");
  const draft = ta.value;
  abortCtl = new AbortController(); btn.disabled = true; stop.hidden = false; note.textContent = "Claude is thinking…";
  stop.onclick = () => abortCtl?.abort();
  const instr = `You are a senior art director. A designer picked every visual choice below by looking at live samples. Rewrite the DRAFT into the final design prompt for an AI that builds web pages.

Rules:
- Keep EVERY concrete value exactly: font names and weights, hex colors, px sizes, ms durations, cubic-bezier curves, radii, the density budget and the section order. Never swap a choice for one you like better.
- Fill the gaps at the same precision: for each PAGE STRUCTURE section, give one line of real content direction using the product's own words; add component states and responsive behaviour where missing.
- Stay inside the density budget. If the density is minimal or ultra-minimal, remove anything decorative that is not required.
- Do not invent facts: no numbers, prices, testimonials, logos or names that the brief does not contain. Use placeholders like [PRICE].
- Keep the same section headings in the same order. English only. Output ONLY the prompt, no preface.

BRIEF
Product: ${S.brief.name}
What it is: ${S.brief.what}
Audience: ${S.brief.audience}
Real items: ${S.brief.items}
Headline idea: ${S.brief.headline}
Primary action: ${S.brief.cta}
${S.brief.notes ? "Designer notes: " + S.brief.notes : ""}

DRAFT
${draft}`;
  try {
    const { text, truncated } = await sample(instr, { signal: abortCtl.signal, cache: false, onText: ({ text }) => { ta.value = text; note.textContent = "Claude is writing…"; } });
    ta.value = text; S.prompt = text; S.promptSource = "claude"; save();
    note.textContent = truncated ? "The answer was cut short; try again." : "Done. You can edit it directly.";
    render();
  } catch (e) {
    if (e?.text) ta.value = e.text; else ta.value = draft;
    const msg = { cancelled: "Stopped.", not_granted: "Claude access wasn’t allowed — copy the base version instead.", rate_limited: "Usage limit reached for now — try again later.", refused: "Claude declined this request; the base version is back.", session_expired: "Please sign in again." }[e?.code] || "The connection dropped — try again.";
    note.textContent = msg; if (e?.code === "refused") ta.value = draft;
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") { sample = null; }
  } finally { btn.disabled = false; stop.hidden = true; abortCtl = null; }
}

function renderHistory() {
  const box = $("#hist"); if (!box) return;
  if (!history.length) { box.innerHTML = `<div class="empty">Nothing saved yet. Prompts you keep appear here, and options you used before are marked in later rounds.</div>`; return; }
  box.innerHTML = history.map((h, i) => `<div class="hist-item"><div class="t"><strong>${esc(h.name)} — ${esc(h.title)}</strong><span>${new Date(h.ts).toLocaleString("en-GB")}</span></div>
    <button class="icon-btn" data-h="copy" data-i="${i}">Copy</button><button class="icon-btn" data-h="load" data-i="${i}">Open</button><button class="icon-btn" data-h="del" data-i="${i}" aria-label="Delete">✕</button></div>`).join("");
  box.onclick = e => { const b = e.target.closest("[data-h]"); if (!b) return; const h = history[+b.dataset.i];
    if (b.dataset.h === "copy") copy(h.prompt);
    if (b.dataset.h === "load") { S.prompt = h.prompt; S.promptSource = "claude"; S.picks = { ...h.picks }; save(); render(); toast("Loaded"); }
    if (b.dataset.h === "del") { history.splice(+b.dataset.i, 1); store.set("history", history); renderHistory(); } };
}

/* ---------------- chrome ---------------- */
function copy(text, ta) {
  const done = () => toast("Copied");
  try { navigator.clipboard.writeText(text).then(done, () => { if (ta) { ta.select(); toast("Text selected — press Ctrl/⌘+C"); } }); }
  catch { if (ta) { ta.select(); toast("Text selected — press Ctrl/⌘+C"); } }
}
let toastT; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }

const needs = { dir: "dir", type: "type", pal: "pal", struct: "struct", sig: "sig" };
function stepDone(i) {
  const id = STEPS[i].id;
  if (id === "brief") return !!S.brief.name.trim();
  if (id === "dens") return !!(S.picks.dens && S.picks.motion);
  if (id === "result") return false;
  return !!S.picks[needs[id]];
}
function go(i) { if (i < 0 || i >= STEPS.length || i > S.maxStep + 1) return; if (STEPS[S.step].id === "result" || i !== S.step) { if (S.promptSource === "local" || !S.prompt) S.prompt = ""; } S.step = i; S.maxStep = Math.max(S.maxStep, i); save(); render(); scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); }

function renderSteps() {
  $("#steps").innerHTML = STEPS.map((s, i) => `<button class="step-pill ${i === S.step ? "on" : ""} ${stepDone(i) ? "done" : ""}" data-i="${i}" ${i > S.maxStep + 1 ? "disabled" : ""} ${i === S.step ? 'aria-current="step"' : ""}><span class="n">${String(i).padStart(2, "0")}</span>${s.fa}</button>`).join("");
  $("#steps").querySelectorAll("button").forEach(b => b.onclick = () => go(+b.dataset.i));
  $("#steps .on")?.scrollIntoView({ block: "nearest", inline: "center" });
}
function renderBar() {
  const id = STEPS[S.step].id, done = stepDone(S.step), isRound = !!ROUNDS[id];
  const status = id === "brief" ? "A product name is enough to start." : id === "result" ? "Go back and change any round whenever you like." : id === "dens" ? (done ? "Great — on to the prompt." : "Pick one density and one motion style.") : done ? "Picked. You can move to the next round." : "Click the sample you like.";
  $("#bar").innerHTML = `<div class="wrap"><span class="status">${status}</span>
    ${S.step > 0 ? `<button class="btn" id="b-back">← Back</button>` : ""}
    ${isRound ? `<button class="btn" id="b-shuf">More options</button>` : ""}
    ${isRound && !done ? `<button class="btn" id="b-rand">Surprise me</button>` : ""}
    ${id === "result" ? `<button class="btn" id="b-new">Start over</button>` : `<button class="btn primary" id="b-next" ${done ? "" : "disabled"}>${STEPS[S.step + 1].id === "result" ? "Build prompt" : "Next"} →</button>`}</div>`;
  $("#b-back") && ($("#b-back").onclick = () => go(S.step - 1));
  $("#b-next") && ($("#b-next").onclick = () => go(S.step + 1));
  $("#b-shuf") && ($("#b-shuf").onclick = () => reshuffle(id));
  $("#b-rand") && ($("#b-rand").onclick = () => { const ids = (S.shown[id] || []).filter(x => !(S.nope[id] || []).includes(x)); S.picks[id] = shuffle(ids)[0]; save(); render(); });
  $("#b-new") && ($("#b-new").onclick = () => { const brief = S.brief; S = fresh(); S.brief = brief; S.step = 1; S.maxStep = 1; save(); render(); });
}

function render() {
  const main = $("#main"), id = STEPS[S.step].id;
  renderSteps();
  if (id === "brief") renderBrief(main);
  else if (ROUNDS[id]) renderRound(main, id);
  else if (id === "dens") renderDens(main);
  else renderResult(main);
  renderBar();
}

loadFont("Hanken Grotesk"); loadFont("Geist Mono");
render();
})();

</script>
